name: itsm

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-itsm}
      POSTGRES_USER: ${DB_USER:-itsm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itsm}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-itsm}
      DB_USER: ${DB_USER:-itsm}
      DB_PASSWORD: ${DB_PASSWORD:-itsm}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4321}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-8h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@itsm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
