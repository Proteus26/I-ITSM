spring:
  application:
    name: itsm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USER:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations (src/main/resources/db/migration).
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Only used when itsm.mail.gateway=smtp. Nothing connects at startup, so a missing SMTP server is harmless.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  auth:
    # HS256 signing secret, at least 32 bytes. No default on purpose: the app refuses to start without it.
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${JWT_TTL:8h}
    login-throttle:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window: ${LOGIN_WINDOW:15m}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321}

itsm:
  # Development only: create a demo employee, technicians and incidents at startup (see README).
  demo-data: ${DEMO_DATA:false}
  mail:
    # logging (default) only writes emails to the log; smtp sends them through spring.mail.*
    gateway: ${ITSM_MAIL_GATEWAY:logging}
    from: ${ITSM_MAIL_FROM:itsm@localhost}
    # Send email on a background thread pool so a slow mail server never delays requests.
    async: ${ITSM_MAIL_ASYNC:true}
  notifications:
    # {id} is replaced by the incident id; the email prefixes it with itsm.frontend-base-url.
    incident-link: ${ITSM_NOTIFICATION_LINK:/incidents/{id}}
  sla:
    # How often open incidents are checked against their SLA deadlines (milliseconds), and whether the check runs at all.
    monitor-interval: ${SLA_MONITOR_INTERVAL:60000}
    monitor-enabled: ${SLA_MONITOR_ENABLED:true}
  assignment:
    # skill-least-loaded (default) or round-robin; an unknown value logs a warning and uses the default.
    strategy: ${ASSIGNMENT_STRATEGY:skill-least-loaded}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4321}

management:
  health:
    mail:
      # The SMTP server is optional; it must not turn /actuator/health DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Set explicitly (and overridable) so springdoc does not log a "enabled by default" warning at every start.
  # Set SPRINGDOC_ENABLED=false to switch the API docs off.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

logging:
  level:
    # Entities are always referenced by id and never proxied, so Hibernate cannot (and need not) build a lazy-loading proxy
    # for the Kotlin entities with final accessors; without this it logs a WARN with a stack trace per such entity at start.
    org.hibernate.metamodel.internal.EntityRepresentationStrategyPojoStandard: ERROR
