spring:
  application:
    name: itsm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USER:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations (src/main/resources/db/migration).
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  auth:
    # HS256 signing secret, at least 32 bytes. No default on purpose: the app refuses to start without it.
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${JWT_TTL:8h}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
