<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard</title>
  <link rel="stylesheet" href="p4.css">
</head>
<body>
<div id="p4-header"></div>
<main>
  <div class="row"><h1>Admin dashboard</h1><span class="spacer"></span><span class="muted" id="updated"></span></div>
  <div id="error" class="error"></div>

  <div class="grid tiles" style="margin-bottom:16px">
    <div class="card tile"><div class="label">Total incidents</div><div class="value" id="t-total">–</div></div>
    <div class="card tile"><div class="label">Open</div><div class="value" id="t-open">–</div></div>
    <div class="card tile bad"><div class="label">Critical (open P1)</div><div class="value" id="t-critical">–</div></div>
    <div class="card tile"><div class="label">Resolved</div><div class="value" id="t-resolved">–</div></div>
    <div class="card tile bad"><div class="label">SLA violations</div><div class="value" id="t-sla">–</div></div>
    <div class="card tile"><div class="label">Within SLA</div><div class="value" id="t-compliance">–</div></div>
  </div>

  <div class="grid charts">
    <div class="card"><strong>Incidents per day (last 30 days)</strong><canvas id="c-trend"></canvas></div>
    <div class="card"><strong>Incidents by service</strong><canvas id="c-service"></canvas></div>
    <div class="card"><strong>Active incidents per technician</strong><canvas id="c-workload"></canvas></div>
    <div class="card"><strong>Mean time to resolve (minutes)</strong><canvas id="c-mttr"></canvas></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="p4.js"></script>
<script>
  ITSM.mountHeader("dashboard.html");
  const charts = {};

  function draw(id, type, labels, data, label) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(document.getElementById(id), {
      type,
      data: { labels, datasets: [{ label, data, backgroundColor: "#2556d9aa", borderColor: "#2556d9", borderWidth: 2, tension: 0.25 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
    });
  }

  async function load() {
    try {
      const [overview, workload, byService, sla, mttr, trend] = await Promise.all([
        ITSM.api("/api/reports/overview"), ITSM.api("/api/reports/technician-workload"),
        ITSM.api("/api/reports/by-service"), ITSM.api("/api/reports/sla-compliance"),
        ITSM.api("/api/reports/mttr"), ITSM.api("/api/reports/trend?days=30"),
      ]);
      document.getElementById("error").textContent = "";
      document.getElementById("t-total").textContent = overview.total;
      document.getElementById("t-open").textContent = overview.open;
      document.getElementById("t-critical").textContent = overview.critical;
      document.getElementById("t-resolved").textContent = overview.resolved;
      document.getElementById("t-sla").textContent = overview.slaViolations;
      document.getElementById("t-compliance").textContent = sla.percentage + "%";

      draw("c-trend", "line", trend.map((p) => p.date.slice(5)), trend.map((p) => p.count), "Incidents");
      draw("c-service", "bar", byService.map((s) => s.serviceName), byService.map((s) => s.incidents), "Incidents");
      draw("c-workload", "bar", workload.map((w) => w.technicianName), workload.map((w) => w.activeIncidents), "Active");
      draw("c-mttr", "bar", mttr.map((m) => m.priority), mttr.map((m) => m.meanMinutes), "Minutes");
      document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("error").textContent = e.message;
    }
  }
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
