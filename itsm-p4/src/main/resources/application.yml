spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/itsm
    username: itsm
    password: itsm
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025          # Mailpit

itsm:
  frontend-base-url: http://localhost:8080
  mail:
    gateway: smtp       # smtp -> Mailpit, logging -> just write emails to the log
    from: itsm@example.local
  notifications:
    incident-link: /incidents/{id}   # where a notification points; change to match P2's detail page route
