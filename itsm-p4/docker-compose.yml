# Merge these services into the team's docker-compose.yml if one already exists.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
    ports:
      - "5432:5432"

  # Fake mail server for the demo. SMTP on :1025, web inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
